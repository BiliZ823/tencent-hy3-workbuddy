<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reddit UGC 内容发布数据看板</title>
<style>
:root {
  --bg: #f8f9fc;
  --card-bg: #ffffff;
  --border: #e8ecf2;
  --text-primary: #1a1d2e;
  --text-secondary: #5e6481;
  --text-muted: #949ab3;
  --accent-blue: #4361ee;
  --danger: #ef4444;
  --success: #10b981;
  --warning: #f59e0b;
  --hy3-prev-color: #6366f1;
  --hy3-official-color: #ec4899;
  --wb-color: #14b8a6;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.08);
  --radius: 16px;
  --radius-sm: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text-primary); line-height: 1.6; min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white; padding: 28px 40px; position: relative; overflow: hidden;
}
.header::before {
  content: ''; position: absolute; top: -50%; right: -20%;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(255,255,255,0.1), transparent 70%);
  border-radius: 50%;
}
.header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; position: relative; }
.header .subtitle { font-size: 14px; opacity: 0.85; margin-top: 4px; font-weight: 400; position: relative; }
.header-actions { position: absolute; top: 24px; right: 40px; display: flex; gap: 12px; align-items: center; }
.last-update { font-size: 12px; opacity: 0.7; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 8px; }
.container { max-width: 1400px; margin: 0 auto; padding: 28px 40px; }
.section-title {
  font-size: 17px; font-weight: 700; color: var(--text-primary);
  margin-bottom: 18px; display: flex; align-items: center; gap: 10px;
}
.section-title .icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: white; }
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-bottom: 36px; }
.product-card {
  background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-sm);
  overflow: hidden; transition: all 0.25s ease; border: 1px solid var(--border);
}
.product-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }
.product-header {
  padding: 18px 22px; display: flex; align-items: center; gap: 12px;
  border-bottom: 2px solid;
}
.product-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
.product-name { font-size: 17px; font-weight: 700; }
.product-body { padding: 16px 22px 20px; }
.content-block { margin-bottom: 16px; }
.content-block:last-child { margin-bottom: 0; }
.content-type-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  padding-bottom: 6px; border-bottom: 1px dashed var(--border); color: var(--text-secondary);
}
.content-type-label.post-icon::before { content: '📝'; font-size: 13px; }
.content-type-label.comment-icon::before { content: '💬'; font-size: 13px; }
.metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.metric-item { text-align: center; padding: 10px 4px; border-radius: 8px; background: #f7f8fc; }
.metric-label { font-size: 11px; color: var(--text-secondary); font-weight: 600; margin-bottom: 3px; }
.metric-value { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
.metric-value.danger { color: var(--danger); }
.metric-value.success { color: var(--text-primary); }
.metric-value.warning { color: var(--text-primary); }
.metric-value.primary { color: var(--text-primary); }
.metric-value.muted { color: var(--text-muted); font-size: 15px; }

/* Post overview row: KPI | 计划 | 发布 */
.post-overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.post-overview .metric-item { padding: 10px 4px; background: linear-gradient(135deg, #f0f4ff 0%, #faf5ff 100%); }

/* Retention cards: 三档并排 — 字体层级与 overview 一致 */
.retention-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ret-card { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 6px; border-radius: 10px; background: #f7f8fc; border: 1px solid var(--border); }
.retention-cards > .ret-card:only-child { grid-column: 1 / -1; flex-direction: row; align-items: baseline; justify-content: center; gap: 14px; padding: 10px 14px; }
.ret-tier { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
.ret-tier-row { display: flex; justify-content: center; gap: 5px; font-size: 11px; color: var(--text-secondary); margin-top: 3px; flex-wrap: wrap; }
.ret-tier-row span { white-space: nowrap; }
.ret-num { font-size: 18px; font-weight: 800; color: var(--danger); line-height: 1.15; }
.ret-exp { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.ret-rate { font-size: 12px; font-weight: 600; color: var(--text-muted); }
.summary-bar { display: flex; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
.summary-chip {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 22px; box-shadow: var(--shadow-sm);
  display: flex; align-items: baseline; gap: 8px;
}
.summary-chip .s-num { font-size: 26px; font-weight: 800; color: var(--text-primary); }
.summary-chip .s-label { font-size: 13px; color: var(--text-secondary); }
.summary-chip .s-rate { font-size: 13px; font-weight: 700; margin-left: 4px; color: var(--text-primary); }
.summary-chip .s-rate.good { color: var(--text-primary); }
.summary-chip .s-rate.bad { color: var(--text-primary); }
.tables-section { margin-top: 10px; }
.tabs { display: flex; gap: 6px; margin-bottom: 18px; }
.tab-btn {
  padding: 10px 22px; border: none; border-radius: 10px;
  background: transparent; color: var(--text-secondary);
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.tab-btn.active { background: var(--accent-blue); color: white; box-shadow: 0 4px 12px rgba(67,97,238,0.35); }
.tab-btn:not(.active):hover { background: #eef1fa; }
.table-container {
  background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden;
}
.table-toolbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 20px; border-bottom: 1px solid var(--border); background: #fafbfd; flex-wrap: wrap; gap: 10px;
}
.filter-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filter-select {
  padding: 7px 14px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; color: var(--text-primary); background: white; cursor: pointer; outline: none;
}
.filter-select:focus { border-color: var(--accent-blue); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: #f7f8fc; }
th {
  padding: 12px 14px; text-align: left; font-weight: 650; color: var(--text-secondary);
  font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 1;
  user-select: none; cursor: pointer; white-space: nowrap;
}
th:hover { color: var(--accent-blue); }
th .sort-arrow { font-size: 10px; margin-left: 4px; opacity: 0.4; }
th.sorted .sort-arrow { opacity: 1; color: var(--accent-blue); }
td {
  padding: 11px 14px; border-bottom: 1px solid #f0f2f6; color: var(--text-primary);
  vertical-align: middle; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #f8faff; }
.status-badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }
.status-retained { background: #ecfdf5; color: #059669; }
.status-deleted { background: #fef2f2; color: #dc2626; }
.status-pending { background: #fffbeb; color: #d97706; }
.status-published { background: #eff6ff; color: #2563eb; }
.link-cell a { color: var(--accent-blue); text-decoration: none; font-size: 12px; word-break: break-all; }
.link-cell a:hover { text-decoration: underline; }
.impression-val { font-weight: 700; color: var(--text-primary); }
.prod-tag { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 700; }
.tag-hy3p { background: #ede9fe; color: #6366f1; }
.tag-hy3o { background: #fce7f3; color: #ec4899; }
.tag-wb { background: #ccfbf1; color: #14b8a6; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }
.footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }
@media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } .product-card:last-child { grid-column: span 2; } }
@media (max-width: 900px) { .kpi-grid { grid-template-columns: 1fr; } .product-card:last-child { grid-column: span 1; } .container { padding: 20px; } .header { padding: 20px; } .header-actions { position: static; margin-top: 12px; justify-content: center; } .summary-bar { flex-direction: column; } }
</style>
</head>
<body>

<div class="header">
  <h1>📊 Reddit UGC 内容发布数据看板</h1>
  <div class="subtitle">腾讯 Hy3 Preview / Hy3 正式版 / WorkBuddy · Reddit 平台内容运营追踪</div>
  <div class="header-actions">
    <span class="last-update">数据快照 · 更新于 2026-07-24</span>
  </div>
</div>

<div class="container">
  <div class="section-title">
    <span class="icon" style="background:linear-gradient(135deg,#667eea,#764ba2)">📈</span>
    总览 KPI
  </div>
  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="tables-section">
    <div class="section-title">
      <span class="icon" style="background:linear-gradient(135deg,#06b6d4,#0891b2)">📋</span>
      详细数据明细
      <span class="badge" id="rowCountBadge" style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:#ede9fe;color:#7c3aed;margin-left:auto;">-- 条记录</span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="posts">📝 发帖 Posts</button>
      <button class="tab-btn" data-tab="comments">💬 评论 Comments</button>
    </div>
    <div class="table-container" style="max-height:600px; overflow-y:auto;">
      <div class="table-toolbar">
        <div class="filter-group">
          <select class="filter-select" id="filterProduct">
            <option value="">全部产品</option>
            <option value="Hy3 Preview">Hy3 Preview</option>
            <option value="Hy3 正式版">Hy3 正式版</option>
            <option value="WorkBuddy">WorkBuddy</option>
            <option value="未标注">未标注/其他</option>
          </select>
          <select class="filter-select" id="filterStatus">
            <option value="">全部状态</option>
            <option value="已发布">已发布</option>
            <option value="待发布">待发布</option>
            <option value="留存">留存</option>
            <option value="被删">被删</option>
          </select>
        </div>
        <div style="font-size:12px;color:var(--text-muted);">点击表头可排序</div>
      </div>
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer">数据来源：Reddit UGC 发布排期 & 数据表 · 自动生成于 <span id="genTime"></span></div>

<div id="gate" class="gate">
  <div class="gate-box">
    <div class="gate-lock">🔒</div>
    <h2>数据已加密</h2>
    <p>请输入查看密码以解锁看板</p>
    <input id="gatePw" type="password" placeholder="查看密码" autocomplete="off" />
    <button id="gateBtn" onclick="tryUnlock()">解锁</button>
    <div id="gateErr" class="gate-err"></div>
  </div>
</div>

.gate-lock{font-size:42px;margin-bottom:6px;}
.gate-box h2{margin:0 0 6px;font-size:20px;color:#0f172a;}
.gate-box p{margin:0 0 18px;font-size:13px;color:#64748b;}
.gate-box input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;margin-bottom:14px;outline:none;}
.gate-box input:focus{border-color:#3b82f6;}
.gate-box button{width:100%;padding:12px;border:none;border-radius:10px;background:#3b82f6;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.gate-box button:hover{background:#2563eb;}
.gate-err{margin-top:12px;font-size:13px;color:#ef4444;min-height:16px;}
</style>

let EMBEDDED_RAW = null;
let currentTab = 'posts';

// ========== Parse Overview Section (rows 3-19) ==========
function parseOverview() {
  const posts = parsePosts();
  const comments = parseComments();
  const overview = {};
  PRODUCTS.forEach(p => { overview[p] = { post:{published:0,retained:0,retained72h:0,retained7d:0,retained30d:0,exp72h:0,exp7d:0,exp30d:0,deleted:0,expSum:0,expSumAll:0}, comment:{published:0,retained:0,retained72h:0,retained7d:0,retained30d:0,deleted:0} }; });
  posts.forEach(po => {
    const m = overview[po.product]; if (!m) return;
    m.post.published += 1;
    const im = num(po.impressions);            // 所有已发布内容的曝光（含被删；"/" 与空按 0 计）
    if (im > 0) m.post.expSumAll += im;
    const d = retDays(po.retentionDays);
    if (d > 0) {   // 填了留存天数即视为"存活过"，被删但带天数也按存活天数计入（用户确认口径）
      m.post.retained += 1; if (im > 0) m.post.expSum += im;   // 总存活(含被删) + 留存曝光(含被删)
      if (d >= 3) { m.post.retained72h += 1; if (im > 0) m.post.exp72h += im; }   // 72h = 3 天
      if (d >= 7) { m.post.retained7d += 1; if (im > 0) m.post.exp7d += im; }
      if (d >= 30) { m.post.retained30d += 1; if (im > 0) m.post.exp30d += im; }
    }
    else if (po.retention === '被删') { m.post.deleted += 1; }
  });
  comments.forEach(co => {
    const m = overview[co.product]; if (!m) return;
    m.comment.published += 1;
    const d = retDays(co.retentionDays);   // 评论留存天数按 72h/7天/30天 拆档（与 Post 同步口径）
    if (d > 0) {
      m.comment.retained += 1;
      if (d >= 3) m.comment.retained72h += 1;
      if (d >= 7) m.comment.retained7d += 1;
      if (d >= 30) m.comment.retained30d += 1;
    }
    else if (co.retention === '被删') m.comment.deleted += 1;
  });
  PRODUCTS.forEach(p => {
    overview[p].post.plan = KPI_TARGETS[p].plan;
    overview[p].post.exposureKPI = KPI_TARGETS[p].exposureKPI;
    overview[p].post.currentExposure = overview[p].post.expSum ? (Math.round(overview[p].post.expSum * 10) / 10).toString() : '0';
    overview[p].post.currentExposureAll = overview[p].post.expSumAll ? (Math.round(overview[p].post.expSumAll * 10) / 10).toString() : '0';
    overview[p].comment.plan = KPI_TARGETS[p].commentPlan;
  });
  return overview;
}


function parsePlan(v) {
  if (v == null) return 0;
  const s = String(v);
  if (s.includes('=')) {
    const parts = s.split('=');
    return num(parts[parts.length - 1]);
  }
  return num(s);
}
function num(v) { const n = parseFloat(String(v ?? '').replace(/[^\d.-]/g, '')); return isNaN(n) ? 0 : n; }
function str(v) { return v == null ? '' : String(v); }
// 留存时间 "留存13天" / "留存30天以上" -> 天数数字（72h = 3 天）
function retDays(v) { const s = String(v ?? ''); const m = s.match(/(\d+)/); if (!m) return 0; const n = parseInt(m[1], 10); return /h|小时/i.test(s) ? n / 24 : n; }

// ========== Parse Posts Detail (template: Posts section, header row has 'Post 标题' in col D/idx3) ==========
function parsePosts() {
  const posts = [];
  if (!rawData) return posts;
  let headerRow = -1;
  for (let i = 0; i < rawData.length; i++) {
    if (String(rawData[i]?.[3] || '').includes('Post 标题')) { headerRow = i; break; }
  }
  if (headerRow < 0) return posts;
  for (let i = headerRow + 1; i < rawData.length; i++) {
    const r = rawData[i];
    if (!r) continue;
    // Stop at the Comments section
    if (String(r[1] || '').includes('Comments') || String(r[3] || '').includes('审核日期')) break;
    const product = str(r[2]).trim();
    if (!product) continue;
    if (!PRODUCTS.includes(product)) continue;
    posts.push({
      date: r[7],
      product: product,
      title: str(r[3]),
      link: str(r[4]),
      status: str(r[5]),
      subreddit: str(r[6]),
      publishTime: r[7],
      impressions: str(r[8]),
      retention: str(r[9]),
      retentionDays: str(r[10]),
      note: str(r[11])
    });
  }
  return posts;
}


// ========== Parse Comments Detail (template: Comments section, header row has '审核日期' in col D/idx3) ==========
function parseComments() {
  const comments = [];
  if (!rawData) return comments;
  let headerRow = -1;
  for (let i = 0; i < rawData.length; i++) {
    if (String(rawData[i]?.[3] || '').includes('审核日期') || String(rawData[i]?.[1] || '').includes('Comments')) { headerRow = i; break; }
  }
  if (headerRow < 0) return comments;
  for (let i = headerRow + 1; i < rawData.length; i++) {
    const r = rawData[i];
    if (!r) continue;
    const product = str(r[4]).trim();
    const content = str(r[6]);
    const origLink = str(r[5]);
    const commentLink = str(r[7]);
    if (!product && !content && !origLink && !commentLink) continue;
    if (!product && !content) continue;
    comments.push({
      reviewDate: r[3],
      product: product || '未标注',
      origLink: origLink,
      content: content,
      commentLink: commentLink,
      status: str(r[8]),
      publishDate: r[9],
      retention: str(r[10]),
      retentionDays: str(r[11]),
      note: str(r[12])
    });
  }
  return comments;
}


function inferProduct(content, origLink, commentLink) {
  const text = (content + ' ' + origLink + ' ' + commentLink).toLowerCase();
  if (text.includes('workbuddy')) return 'WorkBuddy';
  if (text.includes('hy3') || text.includes('hunyuan') || text.includes('tencent') ||
      text.includes('混元') || text.includes('腾讯')) {
    if (text.includes('preview') || text.includes('预览')) return 'Hy3 Preview';
    return 'Hy3 正式版';
  }
  // Some comments reference "OpenClaw", "OpenRouter" which are Hy3 context
  if (text.includes('openclaw') || text.includes('open claw')) return 'Hy3 正式版';
  return '未标注';
}

// ========== Render KPI Cards ==========

    const m = overview[prod];

    card.innerHTML = `
      <div class="product-header" style="border-bottom-color:${colors[prod]};">

        <div class="product-name">${prod}</div>
      </div>

          <div class="content-type-label post-icon">Post 发帖</div>

            <div class="metric-item"><div class="metric-label">发布</div><div class="metric-value primary">${p.published}</div></div>
          </div>
          <div class="retention-cards">
            <div class="ret-card"><div class="ret-tier">7天 留存</div><div class="ret-num">${p.retained7d}</div><div class="ret-exp">${(Math.round(p.exp7d*10)/10)}k</div><div class="ret-rate">留存率 ${p.published > 0 ? Math.round(p.retained7d/p.published*1000)/10 + '%' : '0%'}</div></div>
          </div>
        </div>

          <div class="content-type-label comment-icon">Comment 评论</div>

            <div class="metric-item"><div class="metric-label">发布</div><div class="metric-value primary">${c.published}</div></div>
            <div class="metric-item"><div class="metric-label">被删</div><div class="metric-value warning">${c.deleted}</div></div>
          </div>

function parseFloatK(v) {
  if (!v) return 0;
  let n = parseFloat(String(v).replace(/[^\d.-]/g, ''));
  if (String(v).toLowerCase().includes('k')) n *= 1000;
  return isNaN(n) ? 0 : n;
}

// ========== Render Summary Bar ==========
function renderSummaryBar(overview) {
  const bar = document.getElementById('summaryBar');
  let tpP=0,tpPu=0,tpR=0,tpD=0, tcP=0,tcPu=0,tcR=0,tcD=0;
  Object.values(overview).forEach(m => {
    if (m.post) { tpP+=m.post.plan; tpPu+=m.post.published; tpR+=m.post.retained; tpD+=m.post.deleted; }
    if (m.comment) { tcP+=m.comment.plan; tcPu+=m.comment.published; tcR+=m.comment.retained; tcD+=m.comment.deleted; }
  });
  const rp = tpPu>0 ? (tpR/tpPu*100).toFixed(1) : 0;
  const rc = tcPu>0 ? (tcR/tcPu*100).toFixed(1) : 0;
  bar.innerHTML = `
    <div class="summary-chip"><div><span class="s-num">${tpPu}</span><span class="s-label">/ ${tpP} 帖已发布</span></div><span class="s-rate ${rp>=40?'good':'bad'}">留存率 ${rp}%</span></div>
    <div class="summary-chip"><div><span class="s-num">${tcPu}</span><span class="s-label">/ ${tcP} 评论已发布</span></div><span class="s-rate ${rc>=50?'good':'bad'}">留存率 ${rc}%</span></div>
    <div class="summary-chip"><div><span class="s-num">${tpD+tcD}</span><span class="s-label">条被删除/移除</span></div></div>
    <div class="summary-chip"><div><span class="s-num" style="color:var(--danger)">${tpR+tcR}</span><span class="s-label">条当前留存中</span></div></div>`;
}

// ========== Render Table ==========
let filteredData = [];
function renderTable(posts, comments) {
  const isPost = currentTab === 'posts';
  const items = isPost ? posts : comments;
  const filterProd = document.getElementById('filterProduct').value;
  const filterStatus = document.getElementById('filterStatus').value;

  filteredData = items.filter(item => {
    if (filterProd && item.product !== filterProd) return false;
    if (filterStatus && item.retention !== filterStatus && item.status !== filterStatus) return false;
    return true;
  });

  if (sortCol !== null) {
    filteredData.sort((a,b) => {
      const va = getSortValue(a, sortCol), vb = getSortValue(b, sortCol);
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  const thead = document.getElementById('tableHead');
  if (isPost) {
    thead.innerHTML = `<tr>
      <th data-col="publishTime">发布时间</th><th data-col="product">产品</th><th data-col="title">标题/内容</th>
      <th data-col="status">进度</th><th data-col="subreddit">Subreddit</th><th data-col="impressions">曝光</th>
      <th data-col="retention">留存</th><th data-col="retentionDays">留存时间</th><th data-col="link">链接</th><th data-col="note">备注</th></tr>`;
  } else {
    thead.innerHTML = `<tr>
      <th data-col="reviewDate">审核日期</th><th data-col="product">产品</th><th data-col="origLink">原帖</th>
      <th data-col="content">评论内容</th><th data-col="status">进度</th><th data-col="publishDate">发布日期</th>
      <th data-col="retention">留存</th><th data-col="retentionDays">留存时间</th><th data-col="commentLink">评论链接</th><th data-col="note">备注</th></tr>`;
  }

  thead.querySelectorAll('th').forEach(th => {
    const col = th.dataset.col;
    if (!col) return;
    th.innerHTML += ` <span class="sort-arrow">↕</span>`;
    th.addEventListener('click', () => {
      if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortCol = col; sortDir = 'asc'; }
      thead.querySelectorAll('th').forEach(h => h.classList.remove('sorted'));
      th.classList.add('sorted');
      renderTable(posts, comments);
    });
  });
  if (sortCol) {
    const activeTh = thead.querySelector(`th[data-col="${sortCol}"]`);
    if (activeTh) activeTh.classList.add('sorted');
  }

  const tbody = document.getElementById('tableBody');
  document.getElementById('rowCountBadge').textContent = `${filteredData.length} 条记录`;
  if (filteredData.length === 0) {
    tbody.innerHTML = `<tr><td colspan="10" class="empty-state"><div class="emoji">📭</div><p>暂无匹配的数据记录</p></td></tr>`;
    return;
  }

  tbody.innerHTML = filteredData.map(item => {
    if (isPost) {
      const rc = item.retention === '留存' ? 'status-retained' : (item.retention === '被删' ? 'status-deleted' : '');
      const sc = item.status === '已发布' ? 'status-published' : (item.status === '待发布' ? 'status-pending' : '');
      const tc = item.product === 'Hy3 Preview' ? 'tag-hy3p' : (item.product === 'Hy3 正式版' ? 'tag-hy3o' : 'tag-wb');
      return `<tr>
        <td>${fmtDate(item.publishTime)}</td>
        <td><span class="prod-tag ${tc}">${item.product}</span></td>
        <td title="${esc(item.title)}">${esc(item.title) || '-'}</td>
        <td>${item.status ? `<span class="status-badge ${sc}">${item.status}</span>` : '-'}</td>
        <td>${esc(item.subreddit) || '-'}</td>
        <td class="impression-val">${esc(item.impressions) || '-'}</td>
        <td>${item.retention ? `<span class="status-badge ${rc}">${item.retention}</span>` : '-'}</td>
        <td class="retention-days">${esc(item.retentionDays) || '-'}</td>
        <td class="link-cell">${item.link ? `<a href="${esc(item.link)}" target="_blank">打开 ↗</a>` : '-'}</td>
        <td title="${esc(item.note)}" style="color:var(--text-muted);font-size:12px">${(esc(item.note)||'-').substring(0,30)}</td>
      </tr>`;
    } else {
      const rc = item.retention === '留存' ? 'status-retained' : (item.retention === '被删' ? 'status-deleted' : '');
      const sc = item.status === '已发布' ? 'status-published' : (item.status === '待发布' ? 'status-pending' : '');
      const tc = item.product === 'Hy3 Preview' ? 'tag-hy3p' : (item.product === 'Hy3 正式版' ? 'tag-hy3o' : (item.product === 'WorkBuddy' ? 'tag-wb' : 'tag-hy3p'));
      return `<tr>
        <td>${fmtDate(item.reviewDate)}</td>
        <td><span class="prod-tag ${tc}">${item.product}</span></td>
        <td class="link-cell" style="max-width:160px">${item.origLink ? `<a href="${esc(item.origLink)}" target="_blank">原帖 ↗</a>` : '-'}</td>
        <td title="${esc(item.content)}" style="max-width:280px">${((esc(item.content))||'-').substring(0,80)}${(item.content||'').length>80?'...':''}</td>
        <td>${item.status ? `<span class="status-badge ${sc}">${item.status}</span>` : '-'}</td>
        <td>${fmtDate(item.publishDate)}</td>
        <td>${item.retention ? `<span class="status-badge ${rc}">${item.retention}</span>` : '-'}</td>
        <td class="retention-days">${esc(item.retentionDays) || '-'}</td>
        <td class="link-cell" style="max-width:140px">${item.commentLink && item.commentLink !== '/' ? `<a href="${esc(item.commentLink)}" target="_blank">评论 ↗</a>` : '-'}</td>
        <td title="${esc(item.note)}" style="color:var(--text-muted);font-size:12px">${(esc(item.note)||'-').substring(0,25)}</td>
      </tr>`;
    }
  }).join('');
}


function fmtDate(v) {
  if (v == null || v === '') return '-';
  if (v instanceof Date) return v.toLocaleDateString('zh-CN');
  return String(v);
}
function esc(v) {
  if (v == null) return '';
  return String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function getSortValue(item, col) {
  const v = item[col];
  // retentionDays "留存4天"->4天 / "留存15h"->0.6天（小时折算），统一用 retDays，保证排序正确
  if (col === 'retentionDays') {
    if (v == null || v === '') return 0;
    return retDays(v);
  }
  if (v == null || v === '') return '';
  if (v instanceof Date) return v.getTime();
  if (typeof v === 'number') return v;
  const s = String(v).trim();
  // non-numeric placeholders (deleted posts show "/", "-", "—") count as 0 for numeric sort
  if (s === '/' || s === '-' || s === '—' || s === '–' || s === '') return 0;
  // numeric-like strings (e.g. impressions "210") must sort by value, not lexically
  if (/^-?[\d.,]+$/.test(s)) {
    const n = parseFloat(s.replace(/,/g, ''));
    if (!isNaN(n)) return n;
  }
  return s.toLowerCase();
}

// ========== Tabs & Filters ==========
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    sortCol = null;
    if (rawData) { const p = parsePosts(), c = parseComments(); renderTable(p, c); }
  });
});
['filterProduct','filterStatus'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if (rawData) { const p = parsePosts(), c = parseComments(); renderTable(p, c); }
  });
});

// ========== Render All ==========
function renderAll() {
  const overview = parseOverview();
  const posts = parsePosts();
  const comments = parseComments();
  renderKPICards(overview);
  renderTable(posts, comments);
  document.getElementById('genTime').textContent = new Date().toLocaleString('zh-CN');
}

// ========== Crypto (AES-GCM + PBKDF2) ==========
function b64FromBytes(bytes){let bin='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk){bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));}return btoa(bin);}
function bytesFromB64(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes;}
async function deriveKey(pass,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function decryptData(b64,pass){const buf=bytesFromB64(b64);const salt=buf.slice(0,16);const iv=buf.slice(16,28);const ct=buf.slice(28);const key=await deriveKey(pass,salt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);return new TextDecoder().decode(pt);}

// ========== Password Gate ==========
function tryUnlock(){
  const pw=document.getElementById('gatePw').value;
  const err=document.getElementById('gateErr');
  if(!pw){err.textContent='请输入密码';return;}
  err.textContent='验证中…';
  decryptData(ENC_PAYLOAD,pw).then(json=>{
    EMBEDDED_RAW=JSON.parse(json);
    try{sessionStorage.setItem('dash_data',json);}catch(e){}
    err.textContent='';
    document.getElementById('gate').classList.remove('show');
    startApp();
  }).catch(()=>{err.textContent='密码错误，请重试';});
}

// ========== App Start ==========
function startApp(){
  if (typeof EMBEDDED_RAW !== 'undefined' && EMBEDDED_RAW && EMBEDDED_RAW.length) {
    rawData = EMBEDDED_RAW.map(row => row ? row.map(c => (typeof c === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(c)) ? new Date(c) : c) : row);
    renderAll();
  } else {
    document.getElementById('kpiGrid').innerHTML = `
      <div class="product-card" style="grid-column: span 3;">
        <div style="padding:60px;text-align:center;">
          <div style="font-size:48px;margin-bottom:16px;">📂</div>
          <div style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:8px;">暂无数据</div>
          <div style="font-size:13px;color:var(--text-secondary);">请联系发布者更新数据</div>
        </div>
      </div>`;
    document.getElementById('tableBody').innerHTML = `<tr><td colspan="11" class="empty-state"><div class="emoji">📭</div><p>暂无数据</p></td></tr>`;
  }
  document.getElementById('genTime').textContent = new Date().toLocaleString('zh-CN');
}

// ========== Init ==========
(function init(){
  if (typeof ENC_PAYLOAD !== 'undefined' && ENC_PAYLOAD) {
    const cached = (function(){try{return sessionStorage.getItem('dash_data');}catch(e){return null;}})();
    if (cached) { EMBEDDED_RAW = JSON.parse(cached); startApp(); }
    else {
      document.getElementById('gate').classList.add('show');
      const pw=document.getElementById('gatePw');
      if(pw) pw.addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
    }
  } else {
    startApp();
  }
})();
